name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nusift_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nusift_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run verify:workflow-bundle

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nusift_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nusift_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nusift_ci?schema=public
      NUSIFT_RUN_ADMIN_INSPECTION_APPLICATION_INTEGRATION: "1"
      NUSIFT_RUN_ADMIN_INSPECTION_ISOLATION_INTEGRATION: "1"
      NUSIFT_RUN_ADMIN_INSPECTION_POSTGRES_INTEGRATION: "1"
      NUSIFT_RUN_DOMAIN_GOVERNOR_INTEGRATION: "1"
      NUSIFT_RUN_NOTIFICATION_DEDUPE_INTEGRATION: "1"
      NUSIFT_RUN_PUBLICATION_GATE_MIGRATION_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration
